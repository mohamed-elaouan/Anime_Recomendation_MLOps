<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Recommender System</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            width: 90%;
            max-width: 600px;
            padding: 30px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
            text-align: center;
        }

        h1 {
            margin-bottom: 20px;
            font-weight: 600;
            color: #38bdf8;
        }

        form {
            margin-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 14px;
            opacity: 0.8;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            outline: none;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.1);
            color: white;
        }

        input::placeholder {
            color: rgba(255,255,255,0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: linear-gradient(135deg, #38bdf8, #6366f1);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(56,189,248,0.4);
        }

        .results {
            margin-top: 25px;
            text-align: left;
        }

        .results h2 {
            margin-bottom: 15px;
            font-size: 18px;
            color: #a5f3fc;
        }

        .anime-card {
            background: rgba(255,255,255,0.08);
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        .anime-card:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.02);
        }

        .empty {
            margin-top: 15px;
            font-size: 14px;
            opacity: 0.6;
        }

    </style>
</head>

<body>

    <div class="container">
        <h1>🎌 Anime Recommender</h1>
        <p>Get personalized anime recommendations instantly</p>

        <form action="/" method="POST">
            <label for="userID">Enter your User ID</label>
            <input type="number" id="userID" name="userID" placeholder="e.g. 123" required>
            <button type="submit">✨ Get Recommendations</button>
        </form>

        {% if recommendations %}
        <div class="results">
            <h2>🔥 Recommended for you</h2>

            {% for anime in recommendations %}
                <div class="anime-card">
                    {{ anime }}
                </div>
            {% endfor %}

        </div>
        {% else %}
            <p class="empty">No recommendations yet. Try entering a user ID.</p>
        {% endif %}
    </div>

</body>
</html>
